name: Game regression checks
on:
  push:
    branches: [main, work, recovery/airport-motion, improve/public-commons, fix/live-motion-marina]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  construction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Verify construction terrain, machinery, crew and saved-site migration
        run: node --test test/construction*.test.mjs test/vehicle-input-routing.test.mjs test/walking-surface-budget.test.mjs
      - name: Install browser test tools
        run: |
          python -m pip install playwright
          sudo ln -sf /usr/bin/google-chrome /usr/bin/chromium
      - name: Verify compact controls, full screen and live construction crew
        run: |
          python test/construction-dashboard.browser.py
          python test/construction-earth-crew.browser.py
          python test/game-display-flow.browser.py
          python test/game-viewport.browser.py
          python test/construction-crew.browser.py
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Movement, collider, aircraft and tower regressions
        run: node --test test/tower-radio-audio.test.mjs test/airport-radio.test.mjs test/airport-world.test.mjs test/aircraft-cannon-effects.test.mjs test/aircraft-model.test.mjs test/aircraft-camera.test.mjs test/aircraft-controls.test.mjs test/aircraft-flight-simulation.test.mjs test/aircraft-dogfight.test.mjs test/aircraft-access.test.mjs test/authoritative-room-client.test.mjs test/walking-motion.test.mjs test/walking-network-jitter.test.mjs test/local-walking-view.test.mjs test/local-environment-collision.test.mjs test/environment-floor-winding.test.mjs test/server-builder-instanced-collision.test.mjs test/environment-collision-geometry.test.mjs test/environment-collision-contract.test.mjs test/builder-terrain-collision.test.mjs test/placed-item-collision.test.mjs test/walking-capsule.test.mjs test/walking-collision-regression.test.mjs test/server-walking-collision.test.mjs test/player-walking-stability.test.mjs test/walking-floor-presentation.test.mjs test/local-vehicle-collision.test.mjs test/mobile-flight-input.test.mjs test/mobile-flight-server.test.mjs test/mobile-flight-stick.test.mjs test/arcade-live-movement.test.mjs test/hockey-local-motion.test.mjs test/commons-neighborhood.test.mjs test/commons-clean-ground.test.mjs test/commons-traversal.test.mjs test/generated-world-experiences.test.mjs test/district-neighborhoods.test.mjs test/world-atlas.test.mjs test/atlas-destinations.test.mjs test/slime-floor.test.mjs test/world-directory.test.mjs test/boat-assist-sharing.test.mjs test/boat-simulation.test.mjs test/harbor-simulator.test.mjs test/harbor-camera.test.mjs test/harbor-model-quality.test.mjs test/neon-marina.test.mjs test/neon-docks-expansion.test.mjs test/marina-properties.test.mjs test/local-vehicle-view.test.mjs test/vehicle-actions.test.mjs test/vehicle-auto-server.test.mjs test/vehicle-input-routing.test.mjs test/shared-world-loading.test.mjs test/boat-navigation.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify shared session proofs during panel refreshes
        run: node --test test/session-store.test.mjs test/room-session.test.mjs test/gameplay-session-proof.test.mjs
      - name: Verify touch, overlays and input request recovery
        run: node --test test/joystick-movement.test.mjs test/instant-stick-actions.test.mjs test/rad-tox-controller.test.mjs test/game-menu-controls.test.mjs test/game-request-deadline.test.mjs test/walking-surface-budget.test.mjs
      - name: Install browser test tools
        run: |
          python -m pip install playwright
          sudo ln -sf /usr/bin/google-chrome /usr/bin/chromium
      - name: Verify mobile airport controls
        run: |
          python test/airport-operations.browser.py
          python test/mobile-flight-controls.browser.py
          python test/outdoor-scenery.browser.py
          python test/commons-landscape.browser.py
          python test/harbor-operations.browser.py
          python test/vehicle-actions.browser.py
          python test/harbor-navigation.browser.py
      - name: Verify live walking under delayed network input
        run: python test/live-motion.browser.py
      - name: Verify controls after transport menus and map travel
        run: |
          node --test test/transport-map-access.test.mjs test/server-collision-broadphase.test.mjs test/walking-overlap-recovery.test.mjs test/world-traversal-matrix.test.mjs
          python test/overlay-focus-controls.browser.py
          python test/world-input-recovery.browser.py
          python test/mobile-touch-recovery.browser.py
          python test/mobile-controller-viewport.browser.py
          python test/world-travel-input-order.browser.py
  login-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - name: Verify startup, connection recovery and map lifecycle
        run: node --test test/gameplay-startup-readiness.test.mjs test/rad-tox-startup.test.mjs test/live-map-interaction.test.mjs test/vehicle-input-routing.test.mjs test/xr-game-controls.test.mjs test/api-connection.test.mjs test/game-request-deadline.test.mjs test/local-map-3d.test.mjs test/collision-world-cache.test.mjs
      - name: Install browser test tools
        run: |
          python -m pip install playwright
          sudo ln -sf /usr/bin/google-chrome /usr/bin/chromium
      - name: Verify login, basketball buttons and both maps
        run: |
          python test/basketball-quick-controls.browser.py
          python test/xr-visibility.browser.py
          python test/mobile-map-layout.browser.py
          python test/map-readiness.browser.py
          python test/vehicle-companion-map.browser.py
          python test/fullscreen-panels.browser.py
          python test/game-display-flow.browser.py
          python test/local-map-resource-lifecycle.browser.py
          python test/login-map-controls.browser.py
          python test/sustained-world-controls.browser.py --fault stale-input
          python test/sustained-world-controls.browser.py --world muzikaz-airport --seconds 1 --fault timeout --page-fullscreen
          python test/nonblocking-map-controls.browser.py --page-fullscreen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nonblocking-map-controls-results
          path: /tmp/nonblocking-map-controls-results.json
  world-input:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - name: Install browser test tools
        run: |
          python -m pip install playwright
          sudo ln -sf /usr/bin/google-chrome /usr/bin/chromium
      - name: Verify sustained touch and map travel in every public world
        run: python test/all-world-input.browser.py --report /tmp/all-world-input-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-world-input-results
          path: /tmp/all-world-input-results.json
