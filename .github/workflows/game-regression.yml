name: Game regression checks
on:
  push:
    branches: [main, work, recovery/airport-motion, improve/public-commons, fix/live-motion-marina]
  workflow_dispatch:
permissions:
  contents: read
env:
  ONNXRUNTIME_NODE_INSTALL: skip
jobs:
  construction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Verify construction terrain, machinery, crew and saved-site migration
        run: node --test test/construction*.test.mjs test/machine-walkup.test.mjs test/room-snapshot.test.mjs test/community-life.test.mjs test/thumbstick-input.test.mjs test/game-action-button.test.mjs test/world-residents.test.mjs test/gameplay-actions.test.mjs test/authoritative-room-client.test.mjs test/vehicle-input-routing.test.mjs test/walking-surface-budget.test.mjs
      - name: Install browser test tools
        run: |
          python -m pip install playwright
          sudo ln -sf /usr/bin/google-chrome /usr/bin/chromium
      - name: Verify compact controls, full screen and live construction crew
        run: |
          python test/construction-dashboard.browser.py
          python test/construction-control-recovery.browser.py
          python test/construction-earth-crew.browser.py
          python test/game-display-flow.browser.py
          python test/action-bar-settings.browser.py
          python test/venue-startup-controls.browser.py
          python test/one-row-game-controls.browser.py
          python test/construction-crew.browser.py
          python test/machine-walkup.browser.py
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify generated asset registry and read-only drift detection
        run: |
          npm run check:asset-registry
          node --test test/asset-registry-check.test.mjs test/factory-market-catalog.test.mjs
      - run: npm run build
      - run: npm run check
      - name: Movement, collider, aircraft and tower regressions
        run: node --test test/tower-radio-audio.test.mjs test/airport-radio.test.mjs test/airport-world.test.mjs test/aircraft-cannon-effects.test.mjs test/aircraft-model.test.mjs test/aircraft-camera.test.mjs test/aircraft-controls.test.mjs test/aircraft-flight-simulation.test.mjs test/aircraft-dogfight.test.mjs test/aircraft-access.test.mjs test/authoritative-room-client.test.mjs test/walking-motion.test.mjs test/walking-network-jitter.test.mjs test/local-walking-view.test.mjs test/local-environment-collision.test.mjs test/environment-floor-winding.test.mjs test/server-builder-instanced-collision.test.mjs test/environment-collision-geometry.test.mjs test/environment-collision-contract.test.mjs test/builder-terrain-collision.test.mjs test/placed-item-collision.test.mjs test/walking-capsule.test.mjs test/walking-collision-regression.test.mjs test/server-walking-collision.test.mjs test/player-walking-stability.test.mjs test/walking-floor-presentation.test.mjs test/local-vehicle-collision.test.mjs test/mobile-flight-input.test.mjs test/mobile-flight-server.test.mjs test/mobile-flight-stick.test.mjs test/arcade-live-movement.test.mjs test/hockey-local-motion.test.mjs test/commons-neighborhood.test.mjs test/commons-clean-ground.test.mjs test/commons-traversal.test.mjs test/generated-world-experiences.test.mjs test/district-neighborhoods.test.mjs test/world-atlas.test.mjs test/atlas-destinations.test.mjs test/slime-floor.test.mjs test/world-directory.test.mjs test/boat-assist-sharing.test.mjs test/boat-simulation.test.mjs test/harbor-simulator.test.mjs test/harbor-camera.test.mjs test/harbor-model-quality.test.mjs test/neon-marina.test.mjs test/neon-docks-expansion.test.mjs test/marina-properties.test.mjs test/local-vehicle-view.test.mjs test/vehicle-actions.test.mjs test/vehicle-auto-server.test.mjs test/vehicle-input-routing.test.mjs test/shared-world-loading.test.mjs test/boat-navigation.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fresh movement during delayed snapshots and startup
        run: node --test test/local-walking-view.test.mjs test/arcade-local-motion.test.mjs test/hockey-local-motion.test.mjs test/local-vehicle-view.test.mjs test/movement-presence-recovery.test.mjs test/firing-range-startup.test.mjs test/gameplay-avatar-identity.test.mjs test/server-storage-initialization.test.mjs test/hockey-input-recovery.test.mjs
      - name: Verify shared session proofs during panel refreshes
        run: node --test test/session-store.test.mjs test/room-session.test.mjs test/gameplay-session-proof.test.mjs
      - name: Verify transactional storage and server quality prerequisites
        run: node --test --test-concurrency=2 test/credential-derivation.test.mjs test/opaque-session-secrets.test.mjs test/session-store-cache.test.mjs test/session-store-opaque.test.mjs test/account-store-cache.test.mjs test/room-identity-cache.test.mjs test/user-json-database.test.mjs test/user-json-database-performance.test.mjs test/world-supply-current.test.mjs test/shared-room-store.test.mjs test/room-store-journal.test.mjs test/room-store-player-scope.test.mjs test/room-tick-isolation.test.mjs test/room-resource-lifecycle.test.mjs test/room-result-projection.test.mjs test/room-input-receipts.test.mjs test/scheduled-room-inputs.test.mjs test/room-snapshot-protocol.test.mjs test/room-client-snapshot-protocol.test.mjs test/room-population-snapshot.test.mjs test/world-directory-cache.test.mjs test/gameplay-review.integration.test.mjs
      - name: Verify per-map quests, site work and native game challenges
        run: node --test test/harbor-quest-routes.test.mjs test/solo-map-quests.test.mjs test/map-quest-catalog.test.mjs test/site-quests.test.mjs test/site-quest-world-matrix.test.mjs test/site-work-contracts.test.mjs test/map-quest-prompts.test.mjs test/native-game-challenges.test.mjs test/expanded-quests.test.mjs test/road-quests.test.mjs test/cargo-hauling.test.mjs test/mountain-flight-quests.test.mjs test/patrol-team-quests.test.mjs test/quest-conversations.test.mjs
      - name: Verify live AI conversations and server machine work
        run: node --test test/ai-conversation-actions.test.mjs test/ai-conversation-ui.test.mjs test/ai-world-actions.test.mjs test/ai-interactions.integration.test.mjs test/construction-crew-interactions.test.mjs test/factory-crew-work.test.mjs
      - name: Verify RSS and model discovery feeds
        run: node --test test/rss-feed.test.mjs test/github-glb-discovery.test.mjs
      - name: Verify touch, overlays and input request recovery
        run: node --test test/joystick-movement.test.mjs test/instant-stick-actions.test.mjs test/ground-double-tap.test.mjs test/held-game-input.test.mjs test/game-keyboard-input.test.mjs test/native-facility-input-release.test.mjs test/game-input-release.test.mjs test/game-companion-release.test.mjs test/rad-tox-controller.test.mjs test/game-menu-controls.test.mjs test/game-request-deadline.test.mjs test/walking-surface-budget.test.mjs
      - name: Install browser test tools
        run: |
          python -m pip install playwright
          sudo ln -sf /usr/bin/google-chrome /usr/bin/chromium
      - name: Verify mobile airport controls
        run: |
          python test/transport-startup.browser.py
          python test/ground-double-tap.browser.py
          python test/game-input-release.browser.py
          python test/vehicle-input-release.browser.py
          python test/companion-picker.browser.py
          python test/world-destination-preview.browser.py
          python test/airport-operations.browser.py
          python test/mobile-flight-controls.browser.py
          python test/outdoor-scenery.browser.py
          python test/commons-landscape.browser.py
          python test/harbor-operations.browser.py
          python test/vehicle-actions.browser.py
          python test/harbor-navigation.browser.py
      - name: Verify quest popups and playable local objectives
        run: |
          python test/map-quest-prompts.browser.py
          python test/ai-conversation-ui.browser.py
          python test/quest-toolbar-overflow.browser.py
          python test/facility-control-lifecycle.browser.py
          python test/facility-async-controls.browser.py
          python test/device-modal-controls.browser.py
          python test/ski-race-menu.browser.py
          python test/sports-room-building.browser.py
          python test/construction-crew-interactions.browser.py
          python test/ai-quest-work.browser.py
          python test/native-game-challenges.browser.py
          python test/arcade-display-controls.browser.py
          python test/game-toolbar-movement.browser.py
          python test/native-game-challenges-live.browser.py
          python test/map-quests.browser.py
      - name: Verify live walking under delayed network input
        run: python test/live-motion.browser.py
      - name: Verify controls after transport menus and map travel
        run: |
          node --test test/transport-map-access.test.mjs test/server-collision-broadphase.test.mjs test/walking-overlap-recovery.test.mjs test/world-traversal-matrix.test.mjs
          python test/overlay-focus-controls.browser.py
          python test/facility-input-recovery.browser.py
          python test/world-input-recovery.browser.py
          python test/mobile-touch-recovery.browser.py
          python test/mobile-controller-viewport.browser.py
          python test/world-travel-input-order.browser.py
  login-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - name: Verify startup, connection recovery and map lifecycle
        run: node --test test/gameplay-startup-readiness.test.mjs test/rad-tox-startup.test.mjs test/live-map-interaction.test.mjs test/vehicle-input-routing.test.mjs test/xr-game-controls.test.mjs test/api-connection.test.mjs test/game-request-deadline.test.mjs test/local-map-3d.test.mjs test/collision-world-cache.test.mjs test/collision-candidate-scope.test.mjs test/spawn-clearance.test.mjs test/movement-presence-recovery.test.mjs
      - name: Verify room startup and collision resource lifecycle
        run: node --test test/room-startup-deadline.test.mjs test/native-room-connection.test.mjs test/room-collision-lifecycle.test.mjs test/server-collision-memory.test.mjs
      - name: Verify dense GLB collision and RAD-TOX movement recovery
        run: node --test test/collision-tree.test.mjs test/local-environment-collision.test.mjs test/world-entry-safety.test.mjs test/yacht-walking.test.mjs test/rad-tox-movement-recovery.test.mjs test/rad-tox-solo-flow.test.mjs test/match-results-flow.test.mjs test/resident-world-link.test.mjs test/world-picker-refresh.test.mjs
      - name: Install browser test tools
        run: |
          python -m pip install playwright
          sudo ln -sf /usr/bin/google-chrome /usr/bin/chromium
      - name: Verify login, basketball buttons and both maps
        run: |
          python test/commons-room-connection.browser.py
          python test/map-room-refresh.browser.py
          python test/basketball-quick-controls.browser.py
          python test/xr-visibility.browser.py
          python test/mobile-map-layout.browser.py
          python test/map-readiness.browser.py
          python test/vehicle-companion-map.browser.py
          python test/fullscreen-panels.browser.py
          python test/game-display-flow.browser.py
          python test/action-bar-settings.browser.py
          python test/venue-startup-controls.browser.py
          python test/local-map-resource-lifecycle.browser.py
          python test/login-map-controls.browser.py
          python test/sustained-world-controls.browser.py --fault stale-input
          python test/sustained-world-controls.browser.py --world muzikaz-airport --seconds 1 --fault timeout
          python test/nonblocking-map-controls.browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nonblocking-map-controls-results
          path: /tmp/nonblocking-map-controls-results.json
  world-input:
    strategy:
      fail-fast: false
      matrix:
        mode: [multiplayer, solo]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - name: Install browser test tools
        run: |
          python -m pip install playwright
          sudo ln -sf /usr/bin/google-chrome /usr/bin/chromium
      - name: Verify startup, keyboard and sustained touch in every public world
        run: python test/all-world-input.browser.py --mode ${{ matrix.mode }} --skip-map-travel --hold-ms 700 --report /tmp/all-world-input-results.json
      - name: Verify GLB walking during delayed replies and menu use
        run: python test/glb-free-movement.browser.py --mode ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-world-input-results-${{ matrix.mode }}
          path: |
            /tmp/all-world-input-results.json
            /tmp/glb-free-movement-results.json
