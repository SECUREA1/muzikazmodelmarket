name: Game regression checks
on:
  push:
    branches: [main, work, recovery/airport-motion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: node --test test/walking-motion.test.mjs test/local-walking-view.test.mjs test/aircraft-dogfight.test.mjs
