<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Atlas shared flight telemetry</title><desc id="desc">Illustrated game telemetry showing a prepared model, countdown, scripted flight and target result with a separate cargo landing zone.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8ed6d0" stroke-opacity=".12"/></pattern></defs><rect width="1200" height="520" rx="22" fill="#102c3b"/><rect x="20" y="20" width="1160" height="480" rx="16" fill="url(#grid)" stroke="#547f8a" stroke-width="3"/><text x="54" y="76" fill="#edb87c" font-family="system-ui,sans-serif" font-size="35" font-weight="800">ATLAS / SHARED TEST TELEMETRY</text><text x="54" y="117" fill="#b9d8d7" font-family="system-ui,sans-serif" font-size="21">DEPLOY A CRAFTED MODEL · ARM AT CONTROL · WATCH YOUR RESULT</text><path d="M110 350Q380 110 756 330" fill="none" stroke="#70e1d2" stroke-width="6" stroke-dasharray="12 13"/><path d="M83 350h82m-42-18v36" stroke="#efac69" stroke-width="8"/><g transform="translate(474 213) rotate(68)"><rect x="-13" y="-45" width="26" height="90" rx="8" fill="#ddede9"/><path d="m-13-44 13-28 13 28m-26 60-17 27h17m26-27 17 27h-17" fill="#eeaa63"/></g><g transform="translate(800 348)"><ellipse rx="88" ry="28" fill="none" stroke="#ebbd7b" stroke-width="5"/><ellipse rx="53" ry="17" fill="none" stroke="#8be1d5" stroke-width="5"/><ellipse rx="18" ry="6" fill="#ebbd7b"/></g><rect x="928" y="186" width="198" height="190" rx="15" fill="#193c49" stroke="#78c1bd" stroke-width="3"/><path d="m957 277 68-44 70 44-70 44z" fill="#2e6570" stroke="#e8bd79" stroke-width="4"/><path d="M1025 247v59m-47-29h94" stroke="#78e3d1" stroke-width="4"/><text x="1027" y="353" text-anchor="middle" fill="#cce6dd" font-family="system-ui,sans-serif" font-size="19">CARGO LANDING</text><text x="122" y="422" text-anchor="middle" fill="#d2e9e1" font-family="system-ui,sans-serif" font-size="20">01 / PREPARE</text><text x="395" y="422" text-anchor="middle" fill="#d2e9e1" font-family="system-ui,sans-serif" font-size="20">02 / COUNTDOWN</text><text x="663" y="422" text-anchor="middle" fill="#d2e9e1" font-family="system-ui,sans-serif" font-size="20">03 / FLIGHT</text><text x="966" y="422" text-anchor="middle" fill="#d2e9e1" font-family="system-ui,sans-serif" font-size="20">04 / TELEMETRY</text><text x="54" y="473" fill="#8fbec3" font-family="system-ui,sans-serif" font-size="20">FICTIONAL GAME TRAJECTORY / SHARED ROOM / PERSISTENT RESULTS</text></svg>
