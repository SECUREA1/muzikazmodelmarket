<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">World Item Factory</title><desc id="desc">Four connected manufacturing stages leading through sealed shipping containers into world stock.</desc><rect width="1200" height="675" fill="#102b34"/><path d="M90 405H1110" stroke="#80dcc5" stroke-width="14"/><g fill="#234a56" stroke="#80dcc5" stroke-width="4"><rect x="70" y="230" width="230" height="190" rx="18"/><rect x="345" y="230" width="230" height="190" rx="18"/><rect x="620" y="230" width="230" height="190" rx="18"/><rect x="895" y="230" width="230" height="190" rx="18"/></g><g fill="#e5f7ee" font-family="sans-serif" text-anchor="middle"><text x="600" y="115" font-size="60" font-weight="bold">WORLD ITEM FACTORY</text><text x="600" y="170" font-size="27">Blueprints → Assembly → Quality → Packing</text><text x="185" y="305" font-size="44">01</text><text x="460" y="305" font-size="44">02</text><text x="735" y="305" font-size="44">03</text><text x="1010" y="305" font-size="44">04</text><text x="185" y="367" font-size="27">PREPARE</text><text x="460" y="367" font-size="27">BUILD</text><text x="735" y="367" font-size="27">VERIFY</text><text x="1010" y="367" font-size="27">SEAL</text><text x="600" y="525" font-size="34" fill="#ffcf89">Verified shipping → Every world's inventory</text><text x="600" y="588" font-size="24">Native items · GLB models · Traced batches · Shared stock</text></g></svg>
