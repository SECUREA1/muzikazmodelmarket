<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="title desc"><title id="title">Quest Scroll</title><desc id="desc">An unfurled parchment quest scroll with carved brass-tipped rollers, inked instructions and a red wax seal.</desc><defs>
