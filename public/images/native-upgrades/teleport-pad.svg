<linearGradient id="violet" x2=".8" y2="1"><stop stop-color="#efccff"/><stop offset=".25" stop-color="#a58bff"/><stop offset=".7" stop-color="#5f42be"/><stop offset="1" stop-color="#23265d"/></linearGradient>
