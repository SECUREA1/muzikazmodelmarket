<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="title desc"><title id="title">Teleport Pad</title><desc id="desc">A low circular teleport platform with segmented metal decking, a luminous violet ring and a floating destination marker.</desc><defs>
