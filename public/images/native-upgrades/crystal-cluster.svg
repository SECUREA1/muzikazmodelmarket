<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="title desc"><title id="title">Crystal Cluster</title><desc id="desc">A cluster of five faceted violet and cyan crystals growing from a rough dark stone base.</desc><defs>
<radialGradient id="bg"><stop stop-color="#243653"/><stop offset="1" stop-color="#090f1d"/></radialGradient>
<linearGradient id="steel" x2=".8" y2="1"><stop stop-color="#a3b7c5"/><stop offset=".28" stop-color="#52687b"/><stop offset=".55" stop-color="#273746"/><stop offset="1" stop-color="#14202d"/></linearGradient>
<linearGradient id="edge" x2="0" y2="1"><stop stop-color="#d5e1eb"/><stop offset=".38" stop-color="#657e90"/><stop offset="1" stop-color="#354455"/></linearGradient>
<linearGradient id="gold" x2=".7" y2="1"><stop stop-color="#fff1b4"/><stop offset=".3" stop-color="#d9b461"/><stop offset=".63" stop-color="#a16a30"/><stop offset="1" stop-color="#5d3d22"/></linearGradient>
<linearGradient id="wood" x2="0" y2="1"><stop stop-color="#b57e4e"/><stop offset=".5" stop-color="#85502c"/><stop offset="1" stop-color="#482a22"/></linearGradient>
<linearGradient id="stone" x2=".9" y2="1"><stop stop-color="#7b8b95"/><stop offset=".45" stop-color="#465561"/><stop offset="1" stop-color="#253644"/></linearGradient>
<linearGradient id="parchment" x2=".6" y2="1"><stop stop-color="#fff0c4"/><stop offset=".45" stop-color="#e8cc8f"/><stop offset="1" stop-color="#aa7f48"/></linearGradient>
<linearGradient id="violet" x2=".8" y2="1"><stop stop-color="#efccff"/><stop offset=".25" stop-color="#a58bff"/><stop offset=".7" stop-color="#5f42be"/><stop offset="1" stop-color="#23265d"/></linearGradient>
<linearGradient id="cyan" x2=".8" y2="1"><stop stop-color="#efffff"/><stop offset=".25" stop-color="#80efff"/><stop offset=".65" stop-color="#2895bb"/><stop offset="1" stop-color="#184769"/></linearGradient>
<linearGradient id="pink" x2=".6" y2="1"><stop stop-color="#ffcadc"/><stop offset=".35" stop-color="#fd679e"/><stop offset="1" stop-color="#971c61"/></linearGradient>
<linearGradient id="blue" x2=".6" y2="1"><stop stop-color="#b9f9ff"/><stop offset=".35" stop-color="#448cfa"/><stop offset="1" stop-color="#2f347e"/></linearGradient>
<radialGradient id="field"><stop stop-color="#080d22"/><stop offset=".48" stop-color="#25194c"/><stop offset=".8" stop-color="#6b43ac"/><stop offset="1" stop-color="#c5a3ff"/></radialGradient>
<filter id="glow" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020611" flood-opacity=".8"/></filter>
</defs>
