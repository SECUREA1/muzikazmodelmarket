<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="title desc"><title id="title">Solar Gate Ring</title><desc id="desc">A futuristic circular portal with a segmented titanium frame, amber illuminated inlays and an open solar energy field.</desc><defs>
