<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="title desc"><title id="title">Lever Switch</title><desc id="desc">A mechanical lever switch with a weighted steel base, brass pivot, red grip and a glowing status indicator.</desc><defs>
