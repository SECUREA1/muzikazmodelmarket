<linearGradient id="pink" x2=".6" y2="1"><stop stop-color="#ffcadc"/><stop offset=".35" stop-color="#fd679e"/><stop offset="1" stop-color="#971c61"/></linearGradient>
<linearGradient id="blue" x2=".6" y2="1"><stop stop-color="#b9f9ff"/><stop offset=".35" stop-color="#448cfa"/><stop offset="1" stop-color="#2f347e"/></linearGradient>
