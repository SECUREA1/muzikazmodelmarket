<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="title desc"><title id="title">Energy Crystal</title><desc id="desc">A faceted cyan energy crystal held in a brass and steel pedestal, with smaller companion shards.</desc><defs>
