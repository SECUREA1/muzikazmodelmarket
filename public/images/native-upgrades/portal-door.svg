<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="title desc"><title id="title">Glowing Portal Door</title><desc id="desc">A violet energy doorway with a machined dark metal frame, illuminated rails and swirling portal field.</desc><defs>
