<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="title desc"><title id="title">Runic Portal Arch</title><desc id="desc">An ancient stone arch set with carved runes, brass corner details and a glowing cyan magical opening.</desc><defs>
