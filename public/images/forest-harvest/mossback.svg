<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Mossback, Timberland's wandering snake</title><desc id="desc">An enormous olive green forest python with golden eyes and an undulating emerald body, speaking an odd remark among forest ferns.</desc><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#254736"/><stop offset="1" stop-color="#101f18"/></linearGradient><linearGradient id="skin" x2="0" y2="1"><stop stop-color="#a9b36a"/><stop offset=".4" stop-color="#577c48"/><stop offset="1" stop-color="#284734"/></linearGradient><pattern id="scales" width="24" height="18" patternUnits="userSpaceOnUse"><path d="M0 0Q12 22 24 0M-12 9Q0 31 12 9M12 9Q24 31 36 9" fill="none" stroke="#d4cc8d" stroke-opacity=".22" stroke-width="1.5"/></pattern></defs><rect width="640" height="420" rx="28" fill="url(#sky)"/><g fill="#39563b" opacity=".6"><path d="M58 318 8 318 42 263 23 263 58 196 94 263 75 263 110 318Z"/><path d="m545 312-56 0 41-65-21 0 36-77 40 77-21 0 38 65Z"/></g><ellipse cx="322" cy="330" rx="252" ry="39" fill="#0b1712" opacity=".65"/><path d="M105 293C169 231 241 360 315 295S455 210 480 281 337 352 270 298 396 224 523 303" fill="none" stroke="#172e21" stroke-width="66" stroke-linecap="round"/><path d="M105 284C169 222 241 351 315 286S455 201 480 272 337 343 270 289 396 215 523 294" fill="none" stroke="url(#skin)" stroke-width="56" stroke-linecap="round"/><path d="M105 284C169 222 241 351 315 286S455 201 480 272 337 343 270 289 396 215 523 294" fill="none" stroke="url(#scales)" stroke-width="56" stroke-linecap="round"/><path d="M464 262Q481 234 516 250L555 271Q578 293 546 311L499 309Q470 299 464 262Z" fill="url(#skin)" stroke="#243e2b" stroke-width="3"/><path d="M490 298Q522 309 554 293" fill="none" stroke="#172c1e" stroke-width="3"/><ellipse cx="527" cy="269" rx="12" ry="10" fill="#e8bf57"/><ellipse cx="529" cy="269" rx="2.5" ry="9" fill="#142017"/><circle cx="532" cy="265" r="2" fill="#fff1bd"/><path d="m555 297 31 6m-4-1 12-8m-12 8 10 9" fill="none" stroke="#bb655b" stroke-width="3" stroke-linecap="round"/><path d="M87 61h466a21 21 0 0 1 21 21v98a21 21 0 0 1-21 21H382l-34 34-7-34H87a21 21 0 0 1-21-21V82a21 21 0 0 1 21-21Z" fill="#edf1db"/><text x="99" y="103" fill="#526b44" font-family="system-ui,sans-serif" font-size="18" font-weight="700" letter-spacing="2">MOSSBACK</text><text x="99" y="141" fill="#183326" font-family="Georgia,serif" font-size="24">“The mushrooms keep</text><text x="99" y="174" fill="#183326" font-family="Georgia,serif" font-size="24">moving the moon.”</text><text x="37" y="392" fill="#d5debc" font-family="system-ui,sans-serif" font-size="16" letter-spacing="3">TIMBERLAND · WANDERING FOREST SNAKE</text></svg>
