<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">Dynamite explosion</title>
  <desc id="description">An animated orange and yellow radial explosion burst.</desc>
  <defs><radialGradient id="fire"><stop stop-color="#fff"/><stop offset=".18" stop-color="#fff26a"/><stop offset=".48" stop-color="#ff9418"/><stop offset=".78" stop-color="#f12a18"/><stop offset="1" stop-color="#7b0714" stop-opacity="0"/></radialGradient></defs>
  <g transform-origin="128px 128px">
    <path d="m128 3 18 75 43-63-17 80 73-37-58 58 66 12-70 18 58 53-72-33 13 79-40-68-23 76-2-80-62 50 43-68-79 19 68-41-77-23 80 1-55-59 69 40Z" fill="url(#fire)" stroke="#ffd53d" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="128" cy="128" r="54" fill="#fff8b5" opacity=".8"/>
    <animateTransform attributeName="transform" type="scale" values=".15;.95;1.12" dur=".5s" repeatCount="indefinite" additive="sum"/>
    <animate attributeName="opacity" values="1;.9;0" dur=".5s" repeatCount="indefinite"/>
  </g>
</svg>
