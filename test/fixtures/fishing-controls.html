<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#142c37}.house-stage{position:relative;height:100dvh}button{min-height:44px}</style></head><body><div class="house-stage"><canvas tabindex="0"></canvas></div><script type="module">
import {mountFishingUI} from '/public/js/fishing-ui.js';
import {FISHING_GEAR,FISHING_GUIDES,FISHING_ZONES} from '/public/js/fishing-config.js';
import {gameplayOverlayOpen} from '/public/js/game-menu-controls.js';
import {requestGameInputRelease} from '/public/js/game-input-release.js';
window.env={id:'neon-docks',builderScene:{layoutMeta:{harbor:{}}}};window.commands=[];window.leaked=0;window.releases=0;window.sessionIndex=0;window.delayCast=false;window.resolveCast=null;
window.snapshot={sequence:1,serverTime:Date.now(),actors:{boat:{id:'boat',modelId:'harbor-fishing-boat',boating:{anchor:true,speed:0}}},players:{self:{actorId:'self',health:100,position:{...FISHING_GUIDES[0].position},vehicleId:'boat',fishing:{gear:FISHING_GEAR.map(item=>item.id),creel:[],creelCapacity:30,stats:{},availability:{canCast:true,sides:{port:{canCast:false,reason:'Pier blocks port. Choose starboard.'},starboard:{canCast:true}}}}}},fishing:{enabled:true,zones:FISHING_ZONES,guides:FISHING_GUIDES,tournament:{id:'cup',name:'Harbor Fishing Cup',status:'active',startsAt:Date.now()-1000,endsAt:Date.now()+60000,members:[],leaderboard:[{actorId:'ai-mara',name:'Mara',ai:true,weightKg:1,catches:1}]}}};
function publish(){snapshot.sequence++;snapshot.serverTime=Date.now();ui.update(snapshot,'self',env);return structuredClone(snapshot);}
window.phase=(status)=>{const round=snapshot.players.self.fishing.session;Object.assign(round,{status,tension:.65,progress:.4,fish:{name:'Harbor Mackerel',weightKg:1.42,rarity:'common',valueMzk:14}});publish();};
window.ui=mountFishingUI({stage:document.querySelector('.house-stage'),command:async(action,payload)=>{commands.push({action,...payload});const state=snapshot.players.self.fishing,round=state.session;if(payload.operation==='cast'){if(delayCast)await new Promise(resolve=>window.resolveCast=resolve);state.session={id:'cast'+(++sessionIndex),status:'waiting',side:payload.side,boatId:'boat',zoneId:'marina-fishing',startedAt:Date.now(),castPoint:{x:151,y:0,z:-37}};}if(payload.operation==='hook')state.session.status='reeling';if(payload.operation==='cancel')state.session.status='cancelled';if(payload.operation==='reel'&&round)round.reeling=payload.holding;if(payload.operation==='keep'){state.creel.push({...round.fish,catchId:round.id});round.status='kept';}if(payload.operation==='release')round.status='released';if(payload.operation==='sell')state.creel=[];if(payload.operation==='join-tournament'){snapshot.fishing.tournament||={id:'next',name:'Harbor Fishing Cup',status:'open',startsAt:Date.now()+15000,endsAt:Date.now()+195000,members:[],leaderboard:[]};snapshot.fishing.tournament.members.push('self');}if(payload.operation==='claim-tournament')snapshot.result={message:'Tournament reward saved'};const result=publish();result.result={message:payload.operation==='talk'?'Captain Mara: Hold Reel and release during surges.':'Confirmed '+payload.operation};return result;}});
window.release=()=>requestGameInputRelease('test-menu');document.addEventListener('muzikaz:release-game-input',()=>releases++);window.addEventListener('keydown',event=>{if(!gameplayOverlayOpen()&&['e','f',' ','w'].includes(event.key))leaked++;});ui.update(snapshot,'self',env);document.body.dataset.ready='true';
</script></body></html>
