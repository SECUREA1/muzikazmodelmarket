<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/public/assets/game-menus.css"><link rel="stylesheet" href="/public/assets/sports-action-bar.css"><style>body{margin:0;background:#071b14;color:#efffd7;font-family:system-ui}.house-stage{position:relative;width:100vw;height:100dvh;overflow:hidden;--game-view-controls-height:48px}.sports-action-utilities{position:absolute;top:4px;left:8px}.quarry-sports-utilities{left:100px}.sports-icon-button{width:44px;height:44px}.sports-action-bar button{min-height:44px}.move-proof{position:absolute;left:16px;bottom:16px;min-height:44px}canvas{width:1px;height:1px}</style></head><body><main class="house-stage"><canvas tabindex="0"></canvas><button class="move-proof" type="button">Movement input probe</button></main><script type="module">
import {mountQuarryUI} from '/public/js/quarry-ui.js';
const stage=document.querySelector('.house-stage');window.commands=[];window.releases=[];document.addEventListener('muzikaz:release-game-input',event=>releases.push(event.detail.reason));
window.world={id:'surface-mine-quarry',name:'Test stockyard',quarry:{enabled:true,stations:{screener:{x:85,z:-34},crusher:{x:134,z:-34},stacker:{x:104,z:-7}},loadout:{x:196,y:0,z:174,radius:18},outputPatches:{sand:'product-sand'}}};
window.state={players:{me:{id:'me',health:100,position:{x:80,y:0,z:-25},vehicleId:null}},actors:{truck:{id:'truck',position:{x:172,y:0,z:145},construction:{kind:'truck',bed:0,cargo:{sand:12,gravel:8},load:20},driving:{speed:0}}},construction:{earthworks:{patches:[]}},quarry:{stations:{screener:{enabled:false,running:false,available:true,status:'Parked',feedRate:1},crusher:{enabled:false,running:false,available:true,status:'Parked',feedRate:1},stacker:{enabled:false,running:false,available:true,status:'Parked',feedRate:1}},bins:{sand:4,fines:3},conveyor:true,pendingExports:{},stockInventory:{piles:[{id:'product-sand:sand',patchId:'product-sand',name:'Screen discharge',material:'sand',volume:0,x:62,z:35},{id:'prepared-sand:sand',patchId:'prepared-sand',name:'Prepared sand bay',material:'sand',volume:80,seededVolume:80,x:220,z:150},{id:'raw-gravel:gravel',patchId:'raw-gravel',name:'Gravel receiving mound',material:'gravel',volume:320,seededVolume:320,x:220,z:110},{id:'prepared-topsoil:topsoil',patchId:'prepared-topsoil',name:'Screened soil bay',material:'topsoil',volume:50,seededVolume:50,x:260,z:150}],vehicles:[{id:'truck',name:'Stockyard haul truck',kind:'truck',cargo:{sand:12,gravel:8},volume:20,capacity:40,holderId:null,parked:true,atLoadout:false},{id:'excavator',name:'Loading excavator',kind:'excavator',cargo:{sand:2},volume:2,capacity:2,parked:true,atLoadout:false}],buffers:{sand:4,fines:3},initialStock:{version:'test-v1',lots:[]}}}};
window.ledger={ownerId:'owner',deeds:[{id:'owned-deed',name:'Garden deed',destinationMapId:'plot-owned-deed'}],maps:[{id:world.id,stock:{'quarry:sand':9,'quarry:topsoil':5}}],routes:[{id:'gulf-gateway',name:'Gulf gateway'}],orders:[],shippingMaps:[{id:'hormuz-shipping'}]};let sequence=0;
window.refreshStock=()=>ui.update(state,'me',world);
window.boardTruck=(atLoadout=true,parked=true,bed=0)=>{state.players.me.vehicleId='truck';const truck=state.quarry.stockInventory.vehicles[0];truck.holderId='me';truck.atLoadout=atLoadout;truck.parked=parked;state.actors.truck.construction.bed=bed;refreshStock();};
const inventory={session:async()=>({csrfToken:'test'}),api:async(path,options={})=>{if(options.method){commands.push({endpoint:path,...JSON.parse(options.body)});return {};}return structuredClone(ledger);}};
window.ui=mountQuarryUI({stage,inventory,getPosition:()=>state.players.me.position,onTravel:async id=>{window.travelled=id;},command:async(action,fields)=>{commands.push({action,...fields});if(fields.operation==='reserve-stock'){const amount=fields.quantity,material=fields.material;if(fields.source==='vehicle'){const truck=state.quarry.stockInventory.vehicles[0];if(state.players.me.vehicleId!=='truck'||!truck.parked||!truck.atLoadout||state.actors.truck.construction.bed>.08)throw Error('Truck must be parked at loadout');truck.cargo[material]-=amount;truck.volume-=amount;state.actors.truck.construction.cargo[material]-=amount;state.actors.truck.construction.load-=amount;}else{const pile=state.quarry.stockInventory.piles.find(p=>p.patchId===fields.patchId&&p.material===material);if(!pile||!['sand','topsoil'].includes(material)||pile.volume<amount)throw Error('Choose real processed stock');pile.volume-=amount;}const id='test-reservation-'+ ++sequence;state.quarry.pendingExports[id]={id,ownerId:'owner',material,quantity:amount,status:'reserved'};refreshStock();return {result:{exportId:id}};}if(fields.operation==='book-stock'){const reservation=state.quarry.pendingExports[fields.exportId];if(reservation.status!=='booked'){reservation.status='booked';ledger.maps[0].stock['quarry:'+reservation.material]=(ledger.maps[0].stock['quarry:'+reservation.material]||0)+reservation.quantity;}refreshStock();return {result:{message:'Real stock booked.'}};}return {result:{message:'Fixture operation confirmed.'}};}});
refreshStock();if(!new URL(location.href).searchParams.has('quarryMaterial'))ui.open();document.body.dataset.ready='true';
</script></body></html>
