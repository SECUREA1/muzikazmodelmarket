<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:#183c50;color:white;font-family:system-ui}.house-stage{position:relative;width:100vw;height:100dvh}.house-stage canvas{width:100%;height:100%;background:linear-gradient(#99ccdf 45%,#1b6b81 45%)}button{font:inherit}</style></head><body><div class="house-stage"><canvas tabindex="0" aria-label="Live shipping world"></canvas></div><script type="module">
import {mountShippingUI} from '/public/js/shipping-ui.js';import {SHIPPING_PORTS,SHIPPING_ROUTES,SHIPPING_CARGO} from '/public/js/shipping-config.js';
window.commands=[];window.routes=[];window.releases=0;document.addEventListener('muzikaz:release-game-input',()=>window.releases++);
window.env={id:'hormuz-shipping',builderScene:{layoutMeta:{harbor:{extent:1400}}}};window.snapshot={sequence:1,serverTime:1000,shipping:{enabled:true,ports:SHIPPING_PORTS,contracts:SHIPPING_ROUTES,cargo:SHIPPING_CARGO},players:{self:{health:100,position:{x:-1030,y:0,z:330},shipping:{boardingId:'starter',nearbyPortId:'jebel-ali',canTrade:true,unlocks:['shipping-feeder'],availableContracts:['dock-induction'],stats:{deliveries:0},supplies:{'shipping-parts-stock':2}}}},actors:{starter:{id:'starter',name:'Starter Feeder',modelId:'shipping-feeder',position:{x:-1030,y:0,z:330},boating:{anchor:true,speed:0}}}};
function refresh(){snapshot.sequence++;ui.update(snapshot,'self',env);}window.refresh=refresh;
window.phase=(phase,extra={})=>{snapshot.players.self.shipping.job={id:'contract',phase,title:'Dock induction',originId:'jebel-ali',destinationId:'jebel-ali',units:4,loaded:[],quality:100,waypoints:[{x:-900,z:220,name:'Basin turn'}],checkpointIndex:0,...extra};refresh();};
window.ui=mountShippingUI({stage:document.querySelector('.house-stage'),announce:()=>{},onNavigate:async id=>routes.push(id),command:async(action,fields)=>{commands.push({action,...fields});const self=snapshot.players.self;if(fields.operation==='board'){self.vehicleId='starter';snapshot.actors.starter.holderId='self';}if(fields.operation==='load')self.shipping.job.loaded.push({side:fields.side,mass:2});if(fields.operation==='accept')phase('loading');if(fields.operation==='secure')self.shipping.job.phase='secured';if(fields.operation==='depart')self.shipping.job.phase='sailing';if(fields.operation==='dock')self.shipping.job.phase='unloading';if(fields.operation==='trade')self.shipping.supplies['shipping-parts-stock']--;snapshot.sequence++;return {...snapshot,result:{message:'Server confirmed'}};}});refresh();window.liveFleet=()=>{snapshot.shipping.rivals=[{id:'gulf-link',companyId:'gulf-link',companyName:'Gulf Link',captainName:'Captain Mina',shipId:'rival-ship',color:'#83dbb4',phase:'sailing',etaSeconds:84,job:{originId:'jebel-ali',destinationId:'qeshm',cargoId:'island-provisions',units:4,loaded:[{side:'port',mass:1},{side:'starboard',mass:1}],quality:97,checkpointIndex:1,waypoints:[{x:-1030,z:220},{x:-700,z:40},{x:-80,z:-280}]},stats:{deliveries:2}}];snapshot.actors['rival-ship']={id:'rival-ship',modelId:'shipping-feeder',trafficAI:true,shippingRival:true,position:{x:-700,y:0,z:40},rotation:{y:1.2},boating:{cargoCount:2}};snapshot.shipping.portEconomy=[{portId:'jebel-ali',stock:{'building-supplies':14},demand:{'island-provisions':6},imports:1,exports:2,arrivals:1,departures:2,receivedUnits:12,dispatchedUnits:20,unloaded:12,loaded:20}];snapshot.shipping.dispatch=[{id:'load-1',companyId:'gulf-link',companyName:'Gulf Link',portId:'jebel-ali',type:'departed',message:'Gulf Link departed with island provisions.'}];snapshot.shipping.competition={id:'current-round',name:'Strait Freight League',status:'active',startsAt:0,endsAt:601000,leaderboard:[{actorId:'ai:gulf-link',companyId:'gulf-link',name:'Gulf Link',ai:true,score:44,deliveries:2,unitsDelivered:8,rank:1}]};snapshot.players.self.shipping.competition={canJoin:true,canClaim:true,joined:false,competitionId:'previous-round',prizeMzk:55};refresh();};window.ready=true;
</script></body></html>
