<!doctype html><html lang="en"><meta charset="utf-8"><title>Gameplay audio verification</title><button id="run">Run effects check</button><output id="result"></output><script type="module">
import {effectAudioOutput,playEffectTone,effectNoiseBuffer} from '/public/js/game-effect-audio.js';
import {RoomEffectEvents} from '/public/js/room-effect-events.js';
document.querySelector('#run').addEventListener('click',async()=>{try{const c=new AudioContext();await c.resume();const output=effectAudioOutput(c),analyser=c.createAnalyser();output.disconnect();output.connect(analyser);analyser.connect(c.destination);const accepted=Array.from({length:24},()=>playEffectTone(c,output,440,.12,'sine',.08)).filter(Boolean).length;await new Promise(resolve=>setTimeout(resolve,60));const samples=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(samples);const peak=Math.max(...samples.map(Math.abs));await new Promise(resolve=>setTimeout(resolve,160));const after=Array.from({length:16},()=>playEffectTone(c,output,550,.05)).filter(Boolean).length;const gate=new RoomEffectEvents(),events=Array.from({length:40},(_,i)=>({id:''+i,actorId:'a',action:'fire',at:1000,origin:{x:0,y:1,z:0}})),batch=gate.consume(events,1000),repeat=gate.consume(events,1001);window.audioReport={state:c.state,accepted,after,peak,visuals:batch.length,sounds:batch.filter(e=>e.audible).length,replayed:repeat.length,cachedNoise:effectNoiseBuffer(c)===effectNoiseBuffer(c)};await c.close();document.querySelector('#result').textContent=JSON.stringify(window.audioReport);}catch(error){window.audioError=error.message;}});
</script></html>
