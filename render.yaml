services:
  - type: web
    name: muzikaz-model-market
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: node server.mjs
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 10000
      - key: PUBLIC_BASE_URL
        value: https://muzikazmodelmarket.onrender.com
      - key: MUZIKAZ_DATA_DIR
        value: /var/data/muzikaz
      - key: MUZIKAZ_USER_DATABASE_FILE
        value: /var/data/muzikaz/users.json
      - key: MUZIKAZ_ACCOUNTS_FILE
        value: /var/data/muzikaz/accounts.json
      - key: MUZIKAZ_PAYMENT_ORDERS_FILE
        value: /var/data/muzikaz/payment-orders.json
      - key: MUZIKAZ_ACCOUNT_SESSIONS_FILE
        value: /var/data/muzikaz/account-sessions.json
      - key: MUZIKAZ_GAME_SESSIONS_FILE
        value: /var/data/muzikaz/game-sessions.json
      - key: MUZIKAZ_SESSION_TTL_SECONDS
        value: 28800
      - key: MUZIKAZ_GAME_SESSION_TTL_SECONDS
        value: 300
      - key: MUZIKAZ_CORS_ORIGINS
        value: https://muzikaz.com,https://www.muzikaz.com,https://muzikazmodelmarket.onrender.com
      - key: MUZIKAZ_AVATAR_UPLOAD_DIR
        value: /var/data/muzikaz/uploads/avatars
      - key: MUZIKAZ_ASSET_UPLOAD_DIR
        value: /var/data/muzikaz/uploads/assets
      - key: MUZIKAZ_ENVIRONMENT_UPLOAD_DIR
        value: /var/data/muzikaz/uploads/environments
      - key: MUZIKAZ_ENVIRONMENT_DATA_FILE
        value: /var/data/muzikaz/environments.json
      - key: UPLOAD_STORAGE_PATH
        value: data/uploads/models
      - key: MAX_MODEL_UPLOAD_MB
        value: 50
    disk:
      name: muzikaz-live-data
      mountPath: /var/data
      sizeGB: 1
