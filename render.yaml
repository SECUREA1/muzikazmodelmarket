services:
  - type: web
    name: muzikaz-model-market
    runtime: rust
    plan: free
    buildCommand: cargo build --release
    startCommand: ./target/release/muzikazmodelmarket
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: PUBLIC_BASE_URL
        value: https://muzikazmodelmarket.onrender.com
      - key: MUZIKAZ_DATA_DIR
        value: data
      - key: UPLOAD_STORAGE_PATH
        value: data/uploads/models
      - key: MAX_MODEL_UPLOAD_MB
        value: 50

  - type: web
    name: xreal-spatial-model-catalogue
    runtime: static
    rootDir: apps/render-web-catalogue
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
