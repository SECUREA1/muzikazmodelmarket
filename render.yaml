services:
  - type: web
    name: muzikaz-model-market
    runtime: rust
    buildCommand: npm install --no-package-lock && npm run build && cargo build --release
    startCommand: ./target/release/muzikazmodelmarket
    envVars:
      - key: PORT
        value: 10000
      - key: PUBLIC_BASE_URL
        value: https://muzikazmodelmarket.onrender.com
      - key: MUZIKAZ_DATA_DIR
        value: /var/data
      - key: UPLOAD_STORAGE_PATH
        value: /var/data/uploads/models
      - key: MAX_MODEL_UPLOAD_MB
        value: 50
    disk:
      name: muzikaz-shared-model-data
      mountPath: /var/data
      sizeGB: 1
